<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 站点图标：货架网格 + 近端货位高亮，呼应“货位分配优化”这一核心 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 4x4 货位网格 -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="13" y="13" width="10" height="10" rx="2.5"/>
    <rect x="27" y="13" width="10" height="10" rx="2.5" opacity="0.55"/>
    <rect x="41" y="13" width="10" height="10" rx="2.5" opacity="0.35"/>
    <rect x="13" y="27" width="10" height="10" rx="2.5" opacity="0.7"/>
    <rect x="27" y="27" width="10" height="10" rx="2.5" opacity="0.45"/>
    <rect x="41" y="27" width="10" height="10" rx="2.5" opacity="0.3"/>
    <rect x="13" y="41" width="10" height="10" rx="2.5" opacity="0.5"/>
    <rect x="27" y="41" width="10" height="10" rx="2.5" opacity="0.35"/>
    <rect x="41" y="41" width="10" height="10" rx="2.5" opacity="0.25"/>
  </g>
  <!-- 高亮近端货位（距出入口最近，算法优先分配高频商品） -->
  <rect x="13" y="13" width="10" height="10" rx="2.5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
</svg>

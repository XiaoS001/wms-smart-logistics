<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向智慧物流的仓储管理系统 —— 以货位分配与拣货路径优化为核心" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>智慧仓储管理系统</title>
    <style>
      /* 首屏骨架：避免 JS 加载期间的空白闪烁 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #909399;
        z-index: 9999;
      }
      #app-loading .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-spin 0.9s linear infinite;
      }
      #app-loading .title {
        margin-top: 18px;
        font-size: 15px;
        letter-spacing: 1px;
      }
      #app-loading .sub {
        margin-top: 6px;
        font-size: 12px;
        color: #c0c4cc;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="spinner"></div>
        <div class="title">智慧仓储管理系统</div>
        <div class="sub">正在加载，请稍候…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
